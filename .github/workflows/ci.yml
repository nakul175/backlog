name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.3

permissions:
  contents: read

jobs:
  quality:
    timeout-minutes: 30
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Cache the global bun install cache, keyed by the lockfile.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # High and critical advisories fail the job; moderate and lower only print.
      # GHSA-vfj7-8cjw-p6xm (braces) has no patched release and reaches us only through
      # the Next.js ESLint plugin, which globs the repository's own files.
      - name: Audit dependencies
        run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

      - name: Script tests
        run: bun test scripts/

  build:
    timeout-minutes: 30
    name: Build apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Cache the global bun install cache, keyed by the lockfile.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  test:
    timeout-minutes: 30
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Integration tests need a live database, so they run in the compose gate:
      # a throwaway Postgres and RustFS, with the api built from the production
      # Dockerfile. Building both api-test and worker-test also verifies their
      # Dockerfiles build.
      - name: Build test images
        run: docker compose -f docker-compose.test.yml build

      # `run` starts api-test's dependencies (Postgres healthy, the RustFS bucket
      # init completed), runs the suite, and exits with its code. It does not use
      # --abort-on-container-exit, which would tear the stack down the moment the
      # one-shot rustfs-test-init exits, before api-test starts.
      - name: Run the compose test gate
        run: docker compose -f docker-compose.test.yml run --rm api-test

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  native-artifact:
    name: Reviewed Linux API artifact
    needs: [quality, build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build production API candidate
        run: docker build --label org.opencontainers.image.revision=${{ github.sha }} -f apps/api/Dockerfile -t aplyd-native-logout-btf:${{ github.sha }} .
      - name: Archive candidate without credentials or databases
        run: |
          mkdir -p native-artifact
          docker save aplyd-native-logout-btf:${{ github.sha }} | gzip > native-artifact/btf-native-api.tar.gz
          cd native-artifact
          sha256sum btf-native-api.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: btf-native-logout-linux
          path: native-artifact/
          if-no-files-found: error
          retention-days: 14
